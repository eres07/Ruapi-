<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="ruapi — India's own AI API. Chat and voice in Hindi, English and Hinglish. 100 free credits, 1 credit per call, no sign-up wall." />
<link rel="icon" href="data:," />
<title>ruapi — AI for everyone, from India</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    color-scheme: light;
    --bg:#ffffff;
    --bg-soft:#f7f7f3;
    --bg-softer:#fbfbf9;
    --ink:#12130f;
    --ink-2:#2b2d27;
    --muted:#5f6259;
    --faint:#8a8d83;
    --line:#e8e8e0;
    --line-strong:#d9d9cf;
    --accent:#d9480f;
    --accent-hover:#bf3d0c;
    --accent-soft:#fff2e9;
    --accent-line:#f3c9ae;
    --green:#177245;
    --green-soft:#e9f5ee;
    --card:#ffffff;
    --nav-bg:rgba(255,255,255,.82);
    --code-bg:#101210;
    --code-ink:#eceee6;
    --code-dim:#9aa093;
    --code-accent:#ffa06e;
    --code-green:#8fd6a8;
    --code-blue:#9ecbff;
    --shadow:0 1px 2px rgba(18,19,15,.04),0 12px 32px -16px rgba(18,19,15,.14);
    --shadow-lg:0 2px 4px rgba(18,19,15,.05),0 40px 90px -32px rgba(18,19,15,.28);
    --radius:20px;
    --radius-sm:12px;
    --max:1180px;
    --serif:"Newsreader","Noto Sans Devanagari",Georgia,"Times New Roman",serif;
    --spring:cubic-bezier(.34,1.45,.64,1);
    --ease-out:cubic-bezier(.22,1,.36,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg:#0d0e0c;
      --bg-soft:#141613;
      --bg-softer:#111210;
      --ink:#f2f2ec;
      --ink-2:#d9dbd2;
      --muted:#a3a69b;
      --faint:#7c7f75;
      --line:#262824;
      --line-strong:#353732;
      --accent:#ff7a45;
      --accent-hover:#ff9066;
      --accent-soft:#2b1a10;
      --accent-line:#5a3420;
      --green:#4cc07e;
      --green-soft:#12271b;
      --card:#141613;
      --nav-bg:rgba(13,14,12,.8);
      --code-bg:#080908;
      --code-ink:#eceee6;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.5);
      --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 40px 90px -32px rgba(0,0,0,.65);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Manrope","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:#fff}
  a{color:inherit}
  button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]),textarea{ min-height:2.75rem; }
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

  .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
  section{padding:104px 0}
  @media (max-width:720px){ section{padding:68px 0} }

  /* ---------- Nav ---------- */
  .nav{
    position:sticky;top:0;z-index:50;background:var(--nav-bg);
    -webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
    border-bottom:1px solid var(--line);
  }
  .nav-in{max-width:var(--max);margin:0 auto;padding:0 24px;height:68px;display:flex;align-items:center;gap:28px}
  .wordmark{font-weight:800;font-size:24px;letter-spacing:-.03em;text-decoration:none;display:flex;align-items:baseline;gap:2px;flex:none}
  .wordmark .dot{color:var(--accent)}
  .wordmark .tld{font-size:13px;font-weight:700;color:var(--faint);letter-spacing:0}
  .nav-links{display:flex;gap:4px;margin-left:8px;flex:1}
  .nav-links a{
    text-decoration:none;font-size:15px;font-weight:600;color:var(--muted);
    padding:10px 12px;min-height:44px;display:inline-flex;align-items:center;border-radius:8px;
    transition:color .15s ease,background .15s ease;
  }
  .nav-links a:hover{color:var(--ink);background:var(--bg-soft)}
  .nav-cta{display:flex;align-items:center;gap:10px;flex:none;margin-left:auto}
  .status-pill{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:7px 12px;min-height:36px;text-decoration:none;
    background:var(--card);
  }
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
  .status-dot.live{background:var(--green)}
  .status-dot.down{background:var(--accent)}
  .nav-toggle{
    display:none;width:44px;height:44px;min-height:44px;border:1px solid var(--line);border-radius:10px;
    background:var(--card);color:var(--ink);cursor:pointer;align-items:center;justify-content:center;flex:none;
  }
  .nav-toggle svg{width:22px;height:22px}
  .mobile-menu{display:none;border-top:1px solid var(--line);padding:10px 24px 16px;background:var(--nav-bg)}
  .mobile-menu a{
    display:flex;align-items:center;min-height:48px;font-size:16px;font-weight:700;color:var(--ink-2);
    text-decoration:none;border-bottom:1px solid var(--line);
  }
  .mobile-menu a:last-child{border-bottom:none}
  @media (max-width:860px){
    .nav-links{display:none}
    .nav-toggle{display:inline-flex}
    .mobile-menu.open{display:block}
  }
  @media (max-width:520px){ .status-pill{display:none} }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font:inherit;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;
    border-radius:999px;padding:13px 26px;min-height:52px;border:1px solid transparent;
    transition:background .15s ease,border-color .15s ease,color .15s ease,transform .3s var(--spring),box-shadow .25s ease;
  }
  .btn-primary{background:var(--ink);color:var(--bg)}
  .btn-primary:hover{background:var(--ink-2);transform:translateY(-1px)}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-accent:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 12px 26px -12px rgba(217,72,15,.55)}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
  .btn-ghost:hover{border-color:var(--ink);transform:translateY(-1px)}
  .btn:active{transform:scale(.98)}
  .btn-small{padding:9px 18px;min-height:44px;font-size:15px}
  .btn[disabled]{opacity:.55;cursor:wait}

  /* ---------- Hero ---------- */
  .hero{padding:88px 0 84px;text-align:center;position:relative;overflow:hidden}
  @media (max-width:720px){ .hero{padding:60px 0 56px} }
  .hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(760px 430px at 50% -130px, rgba(255,122,26,.34), rgba(255,122,26,0) 70%),
      radial-gradient(580px 500px at 4% 26%, rgba(110,132,255,.13), rgba(110,132,255,0) 70%),
      radial-gradient(580px 500px at 96% 26%, rgba(110,132,255,.13), rgba(110,132,255,0) 70%),
      linear-gradient(180deg, #fff7ef 0%, rgba(255,247,239,0) 58%);
  }
  .hero::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(18,19,15,.06) 1px, transparent 1.1px);
    background-size:22px 22px;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 62%);mask-image:linear-gradient(180deg,#000 0%,transparent 62%);
  }
  @media (prefers-color-scheme: dark){
    .hero::before{
      background:
        radial-gradient(760px 430px at 50% -130px, rgba(255,122,69,.17), rgba(255,122,69,0) 70%),
        radial-gradient(580px 500px at 4% 26%, rgba(110,132,255,.07), rgba(110,132,255,0) 70%),
        radial-gradient(580px 500px at 96% 26%, rgba(110,132,255,.07), rgba(110,132,255,0) 70%),
        linear-gradient(180deg, rgba(255,122,69,.05) 0%, rgba(255,122,69,0) 58%);
    }
    .hero::after{background-image:radial-gradient(rgba(255,255,255,.055) 1px, transparent 1.1px)}
  }
  .hero .wrap{position:relative;z-index:1}
  .announce{
    display:inline-flex;align-items:center;gap:9px;text-decoration:none;
    font-size:13.5px;font-weight:700;color:var(--ink-2);
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:6px 14px 6px 6px;min-height:38px;box-shadow:var(--shadow);
    transition:border-color .15s ease,transform .3s var(--spring);
  }
  .announce:hover{border-color:var(--accent-line);transform:translateY(-1px)}
  .announce .a-tag{background:var(--accent);color:#fff;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:4px 9px}
  .announce .a-arrow{color:var(--accent);font-weight:800}
  .eyebrow{
    display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:26px 0 0;
  }
  .eyebrow::before,.eyebrow::after{content:"";width:26px;height:1px;background:var(--accent-line)}
  .hero h1{
    margin:20px auto 0;max-width:920px;
    font-family:var(--serif);font-weight:500;
    font-size:clamp(2.9rem,7vw,5.2rem);line-height:1.05;letter-spacing:-.02em;
  }
  .hero h1 .hl{color:var(--accent);font-style:italic}
  .hero .sub{
    margin:26px auto 0;max-width:640px;font-size:clamp(1.05rem,2vw,1.25rem);
    color:var(--muted);line-height:1.65;font-weight:500;
  }
  .hero .sub strong{color:var(--ink);font-weight:700}
  .hero-ctas{margin-top:38px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .hero-note{margin-top:18px;font-size:14px;color:var(--faint);font-weight:600}
  .hero-note .sep{margin:0 8px;opacity:.6}

  /* hero product visual — chat panel */
  .hero-visual{max-width:860px;margin:58px auto 0;position:relative;text-align:left}
  .chat-mock{
    background:var(--card);border:1px solid var(--line);border-radius:26px;
    box-shadow:var(--shadow-lg);overflow:hidden;position:relative;z-index:1;
  }
  .mock-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .mock-dots{display:flex;gap:7px;flex:none}
  .mock-dots i{width:11px;height:11px;border-radius:50%;background:var(--line-strong);display:block}
  .mock-dots i:first-child{background:var(--accent-line)}
  .mock-title{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--muted);font-weight:500}
  .mock-live{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:var(--green)}
  .mock-body{padding:24px;display:grid;gap:12px;background:linear-gradient(180deg,var(--bg-softer),var(--bg))}
  @media (max-width:600px){ .mock-body{padding:16px} }
  .msg{max-width:82%;padding:12px 16px;border-radius:17px;font-size:15.5px;line-height:1.55}
  @media (max-width:600px){ .msg{max-width:92%} }
  .msg.user{margin-left:auto;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
  .msg.ai{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(18,19,15,.04)}
  .msg-meta{display:block;margin-top:8px;font-size:12px;font-weight:700;color:var(--faint)}
  .mock-input{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
  .mock-field{
    flex:1;min-width:0;font-size:15.5px;color:var(--muted);font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .caret{display:inline-block;width:2px;height:1.05em;background:var(--accent);vertical-align:-.18em;margin-left:2px;animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .mock-send{
    width:42px;height:42px;min-height:42px;border-radius:50%;background:var(--accent);color:#fff;flex:none;
    display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
    transition:background .15s ease,transform .3s var(--spring);
  }
  .mock-send:hover{background:var(--accent-hover);transform:translateY(-1px)}
  .mock-send svg{width:19px;height:19px}
  .float-card{
    position:absolute;z-index:2;background:var(--card);border:1px solid var(--line);
    border-radius:17px;box-shadow:var(--shadow-lg);padding:15px 17px;
    animation:floaty 6s ease-in-out infinite alternate;
  }
  .fc-credits{left:-46px;bottom:74px}
  .fc-voice{right:-40px;top:44px;animation-delay:-3s}
  .float-card .fc-big{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1;letter-spacing:-.01em}
  .float-card .fc-label{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:5px;line-height:1.4}
  .fc-voice .fc-top{display:flex;align-items:center;gap:10px}
  .fc-voice .fc-name{font-family:"JetBrains Mono",monospace;font-size:13.5px;font-weight:600;color:var(--accent)}
  .fc-voice .fc-sub{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:5px}
  .wave{display:flex;gap:3px;align-items:center;height:22px}
  .wave i{width:3px;border-radius:2px;background:var(--accent);display:block;animation:waveb 1.15s ease-in-out infinite}
  @keyframes waveb{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
  @keyframes floaty{from{transform:translateY(-4px)}to{transform:translateY(5px)}}
  @media (max-width:1060px){ .fc-credits{left:-8px} .fc-voice{right:-8px} }
  @media (max-width:880px){ .float-card{display:none} }

  /* stats strip */
  .stats{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg-softer)}
  .stats-in{max-width:var(--max);margin:0 auto;padding:0 24px;display:grid;grid-template-columns:repeat(4,1fr)}
  .stat{padding:30px 28px 30px 0}
  .stat + .stat{border-left:1px solid var(--line);padding-left:28px}
  .stat b{display:block;font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
  .stat span.lbl{display:block;margin-top:6px;font-size:14px;color:var(--muted);font-weight:600;line-height:1.45}
  @media (max-width:820px){
    .stats-in{grid-template-columns:1fr 1fr}
    .stat{padding:22px 18px 22px 0}
    .stat + .stat{border-left:none;padding-left:0}
    .stat:nth-child(even){border-left:1px solid var(--line);padding-left:18px}
    .stat b{font-size:28px}
  }

  /* marquee ticker */
  .marquee{
    overflow:hidden;padding:17px 0;border-bottom:1px solid var(--line);background:var(--bg);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
  }
  .mq-track{display:flex;width:max-content;animation:mq 32s linear infinite}
  .marquee:hover .mq-track{animation-play-state:paused}
  .mq-group{display:flex;align-items:center;gap:36px;padding-right:36px}
  .mq-item{display:flex;align-items:center;gap:36px;font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap}
  .mq-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;opacity:.75}
  @keyframes mq{to{transform:translateX(-50%)}}

  /* ---------- Section heads ---------- */
  .sec-head{max-width:720px}
  .sec-head.center{margin:0 auto;text-align:center}
  .kicker{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
  h2{font-family:var(--serif);font-weight:500;font-size:clamp(2.1rem,4.4vw,3.2rem);line-height:1.12;letter-spacing:-.02em;margin:0}
  .sec-lede{margin:18px 0 0;font-size:18px;color:var(--muted);line-height:1.65;font-weight:500}
  .sec-head.center .sec-lede{margin-left:auto;margin-right:auto}

  /* ---------- Platform cards (spotlight) ---------- */
  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:52px}
  @media (max-width:920px){ .cards3{grid-template-columns:1fr} }
  .pcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:32px;display:flex;flex-direction:column;box-shadow:var(--shadow);
    position:relative;overflow:hidden;
    transition:transform .35s var(--spring),border-color .25s ease,box-shadow .3s ease;
  }
  .pcard:hover{transform:translateY(-4px);border-color:var(--line-strong);box-shadow:var(--shadow-lg)}
  .pcard::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s ease;
    background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%), rgba(217,72,15,.09), transparent 65%);
  }
  .pcard:hover::before{opacity:1}
  .pcard > *{position:relative;z-index:1}
  .pcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .pcard-icon{
    width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .pcard-icon svg{width:24px;height:24px}
  .tag{
    font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 11px;border-radius:999px;white-space:nowrap;
  }
  .tag-live{background:var(--green-soft);color:var(--green)}
  .tag-soon{background:var(--accent-soft);color:var(--accent)}
  .tag-core{background:var(--bg-soft);color:var(--muted);border:1px solid var(--line)}
  .pcard h3{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:20px 0 0}
  .pcard p{margin:10px 0 0;color:var(--muted);font-size:16px;line-height:1.6;flex:1}
  .pcard .mono-list{margin:18px 0 0;padding:0;list-style:none;font-family:"JetBrains Mono",monospace;font-size:13.5px;color:var(--ink-2)}
  .pcard .mono-list li{padding:7px 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:12px}
  .pcard .mono-list li span:last-child{color:var(--faint);text-align:right}
  .pcard-link{margin-top:22px;font-weight:800;font-size:15px;color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px}
  .pcard-link:hover{text-decoration:underline}

  /* ---------- Feature bento ---------- */
  .soft{background:var(--bg-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .features{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:52px;box-shadow:var(--shadow)}
  .feat{background:var(--bg);padding:32px;transition:background .3s ease}
  .feat:hover{background:var(--bg-softer)}
  .feat:first-child{grid-column:span 2}
  .feat:last-child{grid-column:span 3}
  @media (max-width:920px){
    .features{grid-template-columns:1fr 1fr}
    .feat:first-child{grid-column:span 2}
    .feat:last-child{grid-column:span 2}
  }
  @media (max-width:600px){
    .features{grid-template-columns:1fr}
    .feat:first-child,.feat:last-child{grid-column:span 1}
  }
  .feat .f-icon{
    color:var(--accent);display:flex;width:44px;height:44px;border-radius:12px;
    background:var(--accent-soft);align-items:center;justify-content:center;
  }
  .feat .f-icon svg{width:22px;height:22px}
  .feat h3{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:16px 0 0}
  .feat p{margin:8px 0 0;font-size:15.5px;color:var(--muted);line-height:1.6}
  .feat p .dev{font-family:"Noto Sans Devanagari","Manrope",sans-serif}

  /* ---------- Build / code + playground ---------- */
  .build-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:52px;align-items:start}
  @media (max-width:960px){ .build-grid{grid-template-columns:minmax(0,1fr)} }
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-width:0}
  .panel-head{padding:22px 26px 0}
  .panel-head h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
  .panel-head p{margin:6px 0 0;color:var(--muted);font-size:15px}
  .tabs{display:flex;gap:6px;padding:18px 26px 0;flex-wrap:wrap}
  .tab{
    font:inherit;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--line);
    background:var(--bg-soft);color:var(--muted);border-radius:999px;padding:8px 16px;min-height:40px;
    transition:background .15s ease,color .15s ease,transform .3s var(--spring);
  }
  .tab:active{transform:scale(.97)}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .codebox{position:relative;margin:18px 26px 26px;background:var(--code-bg);border-radius:var(--radius-sm);overflow:hidden}
  .codebox pre{
    margin:0;padding:20px;overflow-x:auto;max-width:100%;
    font-family:"JetBrains Mono","Noto Sans Devanagari",monospace;font-size:13.5px;line-height:1.7;color:var(--code-ink);
  }
  .codebox .cm{color:var(--code-dim)}
  .codebox .st{color:var(--code-green)}
  .codebox .kw{color:var(--code-blue)}
  .codebox .ac{color:var(--code-accent)}
  .copy-btn{
    position:absolute;top:10px;right:10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;
    background:rgba(255,255,255,.08);color:#eceee6;border:1px solid rgba(255,255,255,.16);
    border-radius:8px;padding:7px 12px;min-height:36px;z-index:2;
  }
  .copy-btn:hover{background:rgba(255,255,255,.16)}

  /* playground */
  .pg{padding:0 26px 26px}
  @media (max-width:600px){ .pg{padding:0 18px 20px} .panel-head{padding:20px 18px 0} .tabs{padding:16px 18px 0} .codebox{margin:16px 18px 20px} }
  .pg-step{display:flex;gap:14px;padding-top:22px}
  .pg-num{
    width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px;
  }
  .pg-body{flex:1;min-width:0}
  .pg-body label{display:block;font-weight:800;font-size:15px;margin-bottom:4px}
  .pg-body .hint{font-size:14px;color:var(--muted);margin:0 0 12px}
  .key-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .key-display{
    font-family:"JetBrains Mono",monospace;font-size:13px;background:var(--bg-soft);
    border:1px dashed var(--line-strong);border-radius:10px;padding:10px 14px;word-break:break-all;
    flex:1;min-width:0;color:var(--ink-2);
  }
  .credits-chip{
    display:none;font-size:14px;font-weight:800;background:var(--green-soft);color:var(--green);
    border-radius:999px;padding:8px 14px;min-height:36px;align-items:center;
  }
  .credits-chip.show{display:inline-flex}
  .pg textarea,.pg select{
    width:100%;font:inherit;font-size:16px;color:var(--ink);
    background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--radius-sm);
    padding:13px 15px;
  }
  .pg textarea{resize:vertical;min-height:84px;line-height:1.55}
  .pg textarea:focus,.pg select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{
    font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);
    background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:38px;
    transition:color .15s ease,border-color .15s ease,transform .3s var(--spring);
  }
  .chip:hover{color:var(--ink);border-color:var(--line-strong)}
  .chip:active{transform:scale(.97)}
  .pg-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
  .pg-status{font-size:14px;font-weight:600;color:var(--muted)}
  .pg-status.err{color:var(--accent)}
  .pg-out{
    margin-top:20px;background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:18px;min-height:96px;font-size:16px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
  }
  .pg-out:empty::before{content:"Replies appear here. Get a key, ask a question — the answer comes straight from the live API.";color:var(--faint)}
  .pg-out .meta{display:block;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-strong);font-size:13px;color:var(--faint);font-weight:600;white-space:normal}

  /* ---------- Voices ---------- */
  .voice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:52px}
  @media (max-width:920px){ .voice-grid{grid-template-columns:1fr 1fr} }
  @media (max-width:600px){ .voice-grid{grid-template-columns:1fr} }
  .vcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);
    position:relative;overflow:hidden;transition:transform .35s var(--spring),border-color .25s ease,box-shadow .3s ease;
  }
  .vcard:hover{transform:translateY(-4px);border-color:var(--line-strong);box-shadow:var(--shadow-lg)}
  .vcard::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s ease;
    background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%), rgba(217,72,15,.08), transparent 65%);
  }
  .vcard:hover::before{opacity:1}
  .vcard > *{position:relative;z-index:1}
  .vcard .vid{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:600;color:var(--accent)}
  .vcard h3{margin:10px 0 0;font-size:19px;font-weight:800;letter-spacing:-.01em}
  .vcard p{margin:7px 0 0;color:var(--muted);font-size:15px;line-height:1.55}
  .vcard .vmeta{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);display:flex;gap:8px;flex-wrap:wrap}
  .vmeta span{font-size:12.5px;font-weight:700;color:var(--muted);background:var(--bg-soft);border:1px solid var(--line);padding:5px 10px;border-radius:999px}
  .samples{margin-top:24px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-softer);padding:28px}
  .samples h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
  .samples > p{margin:8px 0 0;color:var(--muted);font-size:15px;max-width:640px}
  .sample-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
  @media (max-width:820px){ .sample-row{grid-template-columns:1fr} }
  .sample{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:18px}
  .sample b{display:block;font-size:15px}
  .sample span{display:block;font-size:13.5px;color:var(--faint);font-weight:600;margin-top:2px}
  .sample audio{width:100%;margin-top:12px;height:40px}
  .voice-note{margin-top:20px;font-size:14.5px;color:var(--muted);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--radius-sm);padding:16px 18px;line-height:1.6}
  .voice-note strong{color:var(--ink)}

  /* ---------- Impact ---------- */
  .impact{background:var(--ink);color:var(--bg);border-radius:28px;padding:72px 56px;margin:0 24px;position:relative;overflow:hidden;isolation:isolate}
  .impact::before{
    content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(560px 320px at 88% -60px, rgba(255,122,26,.38), rgba(255,122,26,0) 70%),
      radial-gradient(480px 300px at 4% 112%, rgba(255,122,26,.16), rgba(255,122,26,0) 70%);
  }
  @media (max-width:720px){ .impact{padding:48px 26px;margin:0 16px} }
  .impact .kicker{color:var(--accent)}
  @media (prefers-color-scheme: dark){ .impact .kicker{color:#ff9a6e} }
  .impact h2{color:inherit;max-width:760px}
  .impact p{color:inherit;opacity:.75;max-width:640px;font-size:18px;line-height:1.7;margin:20px 0 0;font-weight:500}
  .impact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:48px}
  @media (max-width:820px){ .impact-grid{grid-template-columns:1fr} }
  .impact-item{border-top:1px solid rgba(128,128,128,.35);padding-top:20px}
  .impact-item b{display:block;font-size:17px;font-weight:800}
  .impact-item span{display:block;margin-top:6px;font-size:15px;opacity:.7;line-height:1.6}

  /* ---------- Pillars ---------- */
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:52px}
  @media (max-width:920px){ .pillars{grid-template-columns:1fr} }
  .pillar{padding:8px 28px 8px 0}
  .pillar + .pillar{border-left:1px solid var(--line);padding-left:28px}
  @media (max-width:920px){ .pillar{padding:0} .pillar + .pillar{border-left:none;border-top:1px solid var(--line);padding:24px 0 0} }
  .pillar .p-num{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600;color:var(--accent)}
  .pillar h3{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:12px 0 0}
  .pillar p{margin:10px 0 0;color:var(--muted);font-size:16px;line-height:1.65}

  /* ---------- Endpoints ---------- */
  .ep-list{margin-top:44px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .ep-row{display:grid;grid-template-columns:110px 1.1fr 1.6fr .7fr;gap:18px;align-items:center;padding:18px 24px;background:var(--card)}
  .ep-row + .ep-row{border-top:1px solid var(--line)}
  .ep-row.head{background:var(--bg-soft);font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:13px 24px}
  .method{font-family:"JetBrains Mono",monospace;font-size:12.5px;font-weight:600;padding:5px 0;text-align:center;border-radius:7px;width:64px}
  .m-get{background:var(--green-soft);color:var(--green)}
  .m-post{background:var(--accent-soft);color:var(--accent)}
  .ep-path{font-family:"JetBrains Mono",monospace;font-size:14.5px;font-weight:600;word-break:break-all}
  .ep-desc{color:var(--muted);font-size:15px}
  .ep-cost{font-size:14px;font-weight:700;color:var(--muted);text-align:right}
  @media (max-width:760px){
    .ep-row{grid-template-columns:76px 1fr;grid-template-rows:auto auto}
    .ep-row.head{display:none}
    .ep-desc{grid-column:2}
    .ep-cost{grid-column:2;text-align:left}
  }

  /* ---------- Out of the box ---------- */
  .oob{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:52px}
  @media (max-width:920px){ .oob{grid-template-columns:1fr} }
  .oob-card{border:1px solid var(--line);border-radius:var(--radius);padding:30px;background:var(--card);transition:transform .35s var(--spring),box-shadow .3s ease}
  .oob-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .oob-card .big{font-family:var(--serif);font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1;color:var(--accent)}
  .oob-card h3{font-size:19px;font-weight:800;margin:16px 0 0;letter-spacing:-.01em}
  .oob-card p{margin:9px 0 0;color:var(--muted);font-size:15.5px;line-height:1.6}

  /* ---------- Final CTA / footer ---------- */
  .final{padding:110px 0;text-align:center}
  .final h2{font-size:clamp(2.3rem,5vw,3.8rem);max-width:720px;margin:0 auto}
  .final p{margin:20px auto 0;max-width:540px;color:var(--muted);font-size:18px;font-weight:500}
  footer{border-top:1px solid var(--line);background:var(--bg-softer)}
  .foot-in{max-width:var(--max);margin:0 auto;padding:52px 24px 40px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
  @media (max-width:820px){ .foot-in{grid-template-columns:1fr 1fr} }
  @media (max-width:480px){ .foot-in{grid-template-columns:1fr} }
  .foot-brand p{margin:12px 0 0;color:var(--muted);font-size:14.5px;max-width:280px;line-height:1.6}
  footer h4{margin:4px 0 14px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  footer ul{list-style:none;margin:0;padding:0}
  footer li{margin:0}
  footer ul a{display:inline-flex;align-items:center;min-height:38px;font-size:15px;font-weight:600;color:var(--muted);text-decoration:none}
  footer ul a:hover{color:var(--ink)}
  .foot-base{border-top:1px solid var(--line)}
  .foot-base-in{max-width:var(--max);margin:0 auto;padding:20px 24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--faint);font-weight:600}
  .foot-base a{color:var(--muted)}

  /* ---------- Scroll reveals (Motion-style) ---------- */
  html.js [data-rv]{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s var(--ease-out)}
  html.js [data-rv].in{opacity:1;transform:none}

  /* ---------- Aurora hero background ---------- */
  .aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .aurora i{position:absolute;border-radius:50%;filter:blur(70px);display:block;opacity:.55}
  .aurora .a1{width:560px;height:360px;left:50%;top:-190px;margin-left:-280px;background:radial-gradient(closest-side,rgba(255,122,26,.5),rgba(255,122,26,0));animation:aurora 16s ease-in-out infinite alternate}
  .aurora .a2{width:480px;height:380px;left:-150px;top:40px;background:radial-gradient(closest-side,rgba(110,132,255,.34),rgba(110,132,255,0));animation:aurora 20s ease-in-out infinite alternate-reverse}
  .aurora .a3{width:480px;height:380px;right:-150px;top:30px;background:radial-gradient(closest-side,rgba(255,166,88,.42),rgba(255,166,88,0));animation:aurora 22s ease-in-out infinite alternate}
  @keyframes aurora{from{transform:translate3d(-24px,0,0) scale(1)}to{transform:translate3d(24px,14px,0) scale(1.08)}}
  @media (prefers-color-scheme: dark){ .aurora i{opacity:.3} }

  /* ---------- Masked line reveal (headline) ---------- */
  .line-mask{display:block;overflow:hidden;padding-bottom:.09em;margin-bottom:-.09em}
  .line-in{display:block;animation:lineUp .95s var(--ease-out) both}
  .line-mask.d2 .line-in{animation-delay:.14s}
  @keyframes lineUp{from{transform:translateY(112%)}to{transform:translateY(0)}}

  /* ---------- Resizable nav ---------- */
  .nav-in{transition:height .3s var(--ease-out)}
  .nav.scrolled .nav-in{height:56px}
  .nav.scrolled{box-shadow:0 10px 32px -20px rgba(18,19,15,.3)}

  /* ---------- Shiny accent button ---------- */
  .btn-accent{position:relative;overflow:hidden}
  .btn-accent::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.38) 50%,transparent 68%);transform:translateX(-130%);transition:transform .7s ease;pointer-events:none}
  .btn-accent:hover::after{transform:translateX(130%)}

  /* ---------- Terminal chrome ---------- */
  .term-bar{display:flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
  .term-bar i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.16);display:block;flex:none}
  .term-bar i:first-child{background:rgba(255,122,69,.8)}
  .term-bar .term-title{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--code-dim);margin-left:8px;white-space:nowrap;overflow:hidden}
  .term-bar .copy-btn{position:static;margin-left:auto;flex:none}
  .typed-caret{display:inline-block;width:8px;height:1.05em;background:var(--code-accent);vertical-align:-.15em;animation:blink 1s steps(1) infinite}

  /* ---------- Voice card stack ---------- */
  .vstack{position:relative;max-width:640px;margin:52px auto 0;height:254px}
  @media (max-width:600px){ .vstack{height:292px} }
  .vstack-card{
    position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;
    transition:transform .45s var(--spring),opacity .3s ease;will-change:transform;user-select:none;-webkit-user-select:none;
  }
  .vstack-card .vid{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:600;color:var(--accent)}
  .vstack-card h3{margin:10px 0 0;font-size:21px;font-weight:800;letter-spacing:-.01em}
  .vstack-card p{margin:8px 0 0;color:var(--muted);font-size:15.5px;line-height:1.6;flex:1}
  .vstack-card .vmeta{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);display:flex;gap:8px;flex-wrap:wrap}
  .vstack-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:24px;flex-wrap:wrap}
  .vstack-btn{
    font:inherit;font-size:14px;font-weight:800;cursor:pointer;color:var(--ink);
    background:var(--card);border:1px solid var(--line-strong);border-radius:999px;padding:9px 18px;min-height:44px;
    transition:transform .3s var(--spring),border-color .15s ease;
  }
  .vstack-btn:hover{border-color:var(--ink)}
  .vstack-btn:active{transform:scale(.97)}
  .vstack-count{font-size:13.5px;font-weight:700;color:var(--faint);font-family:"JetBrains Mono",monospace}
  .vstack-hint{text-align:center;font-size:13px;color:var(--faint);font-weight:600;margin-top:10px}

  @media (prefers-reduced-motion: reduce){
    html.js [data-rv]{opacity:1;transform:none;transition:none}
    .mq-track,.wave i,.float-card,.caret,.aurora i,.line-in,.typed-caret{animation:none}
    .btn,.pcard,.vcard,.oob-card,.tab,.chip,.announce,.mock-send,.vstack-card,.nav-in{transition:none}
    .btn-accent::after{display:none}
  }
</style>
</head>
<body>

          var t0 = null;
          var step = function(ts){
            if (!t0) t0 = ts;
            var p = Math.min((ts - t0) / 1000, 1);
            var e = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(target * e);
            if (p < 1) raf = requestAnimationFrame(step);
          };
          raf = requestAnimationFrame(step);
        }
      }, { threshold: .4 });
      io.observe(el);
      return function(){ io.disconnect(); cancelAnimationFrame(raf); };
    }, []);

  /* ==================== PLAYGROUND ==================== */
  var CHIPS = [
    ["नमस्ते, AI kya hai samjhao", "नमस्ते, AI kya hai samjhao"],
    ["Mujhe ek chhota sa business idea batao, kam paise mein", "Business idea in Hinglish"],
    ["Translate 'thank you, see you tomorrow' to Hindi", "Translate to Hindi"],
    ["Explain GST for a small SaaS in India in 3 lines", "Explain GST simply"]
  ];
  function Playground(){
    var k = useState(""); var apiKey = k[0], setApiKey = k[1];
    var c = useState(null); var credits = c[0], setCredits = c[1];
    var st = useState({ text: "", err: false }); var status = st[0], setStatusState = st[1];
    var o = useState(null); var out = o[0], setOut = o[1];
    var bk = useState(false); var busyKey = bk[0], setBusyKey = bk[1];
    var ba = useState(false); var busyAsk = ba[0], setBusyAsk = ba[1];
    var ms = useState("नमस्ते, AI kya hai samjhao"); var msg = ms[0], setMsg = ms[1];
    var lg = useState(""); var lang = lg[0], setLang = lg[1];
    var msgRef = useRef(null);
    var keyBoxRef = useRef(null);
    function setStatus(text, err){ setStatusState({ text: text || "", err: !!err }); }

    function getKey(){
      setBusyKey(true);
      setStatus("Creating your key…");
      fetch(API + "/v1/keys", { method: "POST" }).then(function(r){
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }).then(function(j){
        setApiKey(j.api_key);
        setCredits(j.credits);
        setStatus("Key created — ask away.");
        setOut({ text: "Key created with " + j.credits + " free credits. Now ask a question below — each answer costs 1 credit.", meta: null });
      }).catch(function(){
        setStatus("Couldn’t reach the API. Check your connection and try again.", true);
      }).then(function(){ setBusyKey(false); });
    }
    function ask(){
      if (!apiKey) {
        setStatus("Get a free key first (step 1).", true);
        if (keyBoxRef.current) keyBoxRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      var m = msg.trim();
      if (!m) { setStatus("Type a question first.", true); return; }
      setBusyAsk(true);
      setStatus("Asking ruapi…");
      var body = { message: m };
      if (lang) body.language = lang;
      fetch(API + "/v1/chat", {
        method: "POST",
        headers: { "Authorization": "Bearer " + apiKey, "Content-Type": "application/json" },
        body: JSON.stringify(body)
      }).then(function(r){
        return r.json().then(function(j){ return { ok: r.ok, status: r.status, j: j }; });
      }).then(function(res){
        if (!res.ok) {
          var detail = (res.j && res.j.detail) ? res.j.detail : ("Error " + res.status);
          if (res.status === 402) detail = "Out of credits on this key — create a new free key in step 1.";
          setOut({ text: detail, meta: null });
          setStatus("API said no — see the reply box.", true);
          return;
        }
        setCredits(res.j.credits_remaining);
        var langName = res.j.language === "hi" ? "Hindi" : (res.j.language === "en" ? "English" : res.j.language);
        setOut({ text: res.j.reply, meta: "Model: " + res.j.model + " · Language: " + langName + " · Credits left: " + res.j.credits_remaining });
        setStatus("");
      }).catch(function(){
        setStatus("Couldn’t reach the API. Try again in a moment.", true);
      }).then(function(){ setBusyAsk(false); });
    }
    function checkCredits(){
      if (!apiKey) { setStatus("Get a free key first (step 1).", true); return; }
      setStatus("Checking…");
      fetch(API + "/v1/credits", { headers: { "Authorization": "Bearer " + apiKey } }).then(function(r){
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }).then(function(j){
        setCredits(j.credits);
        setStatus("You have " + j.credits + " credits left.");
      }).catch(function(){
        setStatus("Couldn’t check credits — the API may have restarted; create a fresh key if calls fail.", true);
      });
    }
    return html`
    <div className="panel" id="playground" data-rv>
      <div className="panel-head">
        <h3>Try the live API</h3>
        <p>This playground talks to the real text API at <span style=${{ fontFamily: "'JetBrains Mono',monospace", fontSize: "13.5px" }}>ruapi1.vercel.app</span> — real key, real credits, real answers.</p>
      </div>
      <div className="pg">

              <span className=${"credits-chip" + (credits !== null ? " show" : "")}>${credits !== null ? credits + (credits === 1 ? " credit left" : " credits left") : ""}</span>
            </div>
            <div className="key-row" style=${{ marginTop: "10px" }}>
              <div className="key-display" ref=${keyBoxRef}>${apiKey || "No key yet — your key will appear here."}</div>
              <button className="btn btn-ghost btn-small" disabled=${!apiKey} onClick=${function(e){ if (apiKey) copyText(apiKey, e.currentTarget, "Copied ✓"); }}>Copy key</button>
            </div>
          </div>
        </div>
        <div className="pg-step">
          <div className="pg-num">2</div>
          <div className="pg-body">
            <label htmlFor="pgMsg">Ask ruapi anything</label>
            <p className="hint">Hindi, Hinglish or English — it replies in your language. Each question costs 1 credit.</p>
            <textarea id="pgMsg" ref=${msgRef} value=${msg} onInput=${function(e){ setMsg(e.target.value); }} placeholder="e.g. नमस्ते, AI kya hai samjhao — or: mujhe ek business idea batao"></textarea>
            <div className="chips" aria-label="Example questions">
              ${CHIPS.map(function(ch){
                return html`<button key=${ch[1]} className="chip" onClick=${function(){ setMsg(ch[0]); if (msgRef.current) msgRef.current.focus(); }}>${ch[1]}</button>`;
              })}
            </div>
            <div className="pg-actions">
              <select id="pgLang" aria-label="Language" style=${{ width: "auto", minWidth: "170px" }} value=${lang} onChange=${function(e){ setLang(e.target.value); }}>
                <option value="">Auto-detect</option>
                <option value="hi">Hindi</option>
                <option value="en">English</option>
              </select>
              <button className="btn btn-accent btn-small" disabled=${busyAsk} onClick=${ask}>Ask — 1 credit</button>
              <button className="btn btn-ghost btn-small" onClick=${checkCredits}>Check credits</button>
              <span className=${"pg-status" + (status.err ? " err" : "")} role="status">${status.text}</span>
            </div>
            <div className="pg-out" aria-live="polite">${out ? out.text : null}${out && out.meta ? html`<span className="meta">${out.meta}</span>` : null}</div>
          </div>
        </div>
      </div>
    </div>`;
  }

        <div className="build-grid">
          <${CodePanel} />
          <${Playground} />
        </div>
      </div>
    </section>`;

  function VoiceStack(){
    var ord = useState([0, 1, 2, 3, 4, 5]);
    var order = ord[0], setOrder = ord[1];
    var dg = useState(0);
    var dx = dg[0], setDx = dg[1];
    var dr = useState(false);
    var dragging = dr[0], setDragging = dr[1];
    var startRef = useRef(null);
    function cycle(){ setOrder(function(o){ return o.slice(1).concat(o[0]); }); setDx(0); }
    function back(){ setOrder(function(o){ return [o[o.length - 1]].concat(o.slice(0, o.length - 1)); }); setDx(0); }
    function down(e){
      startRef.current = e.clientX;
      setDragging(true);
      if (e.currentTarget.setPointerCapture) { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {} }
    }
    function move(e){ if (startRef.current === null || startRef.current === undefined) return; setDx(e.clientX - startRef.current); }
    function up(){
      if (startRef.current === null || startRef.current === undefined) return;
      if (Math.abs(dx) > 80) cycle(); else setDx(0);
      startRef.current = null;
      setDragging(false);
    }
    var top = order[0];
    return html`
    <div data-rv>
      <div className="vstack">
        ${order.map(function(vi, pos){
          var v = VOICES[vi];
          var isTop = pos === 0;
          var transform = isTop
            ? "translateX(" + dx + "px) rotate(" + (dx / 22) + "deg)"
            : "translateY(" + (pos * 13) + "px) scale(" + (1 - pos * .045) + ")";
          var style = {
            transform: transform, zIndex: 10 - pos,
            opacity: pos > 2 ? 0 : 1, pointerEvents: pos > 2 ? "none" : "auto",
            touchAction: "pan-y", cursor: isTop ? "grab" : "default",
            transition: (isTop && dragging) ? "none" : undefined
          };
          return html`
          <article className="vstack-card" key=${v[0]} style=${style}
            onPointerDown=${isTop ? down : null} onPointerMove=${isTop ? move : null}
            onPointerUp=${isTop ? up : null} onPointerCancel=${isTop ? up : null}>
            <div className="vid">${v[0]}</div>
            <h3>${v[1]}</h3>
            <p>${v[2]}</p>
            <div className="vmeta">${v[3].map(function(t){ return html`<span key=${t}>${t}</span>`; })}</div>
          </article>`;
        })}
      </div>
      <div className="vstack-nav">
        <button className="vstack-btn" onClick=${back}>← Prev voice</button>
        <span className="vstack-count">${top + 1} / ${VOICES.length} · ${VOICES[top][0]}</span>
        <button className="vstack-btn" onClick=${cycle}>Next voice →</button>
      </div>
      <p className="vstack-hint">Drag the top card, or step through — all six voices share the same keys and credits.</p>
    </div>`;
  }
  function Voices(){
    return html`
    <section className="soft" id="voices">

          <p className="kicker">Voice API · In testing</p>
          <h2>Six voices. Hindi first.</h2>

      els.forEach(function(el, i){ el.style.transitionDelay = Math.min((i % 3) * 80, 240) + "ms"; });
      if (REDUCED || !("IntersectionObserver" in window)) {
        els.forEach(function(el){ el.classList.add("in"); });
        return;
      }
      var io = new IntersectionObserver(function(es){
        es.forEach(function(en){
          if (en.isIntersecting) {
            en.target.classList.add("in");
            io.unobserve(en.target);
            setTimeout(function(){ en.target.style.transitionDelay = "0ms"; }, 1100);
          }
        });
      }, { threshold: .1, rootMargin: "0px 0px -36px 0px" });
      els.forEach(function(el){ io.observe(el); });
      return function(){ io.disconnect(); };
    }, []);
    return html`
    <div>
      <${Nav} />
      <main id="top">
        <${Hero} />
        <${Stats} />
        <${Marquee} />
        <${Platform} />
        <${Features} />
        <${Build} />
        <${Voices} />
        <${Impact} />
        <${Pillars} />
        <${Endpoints} />
        <${Credits} />
        <${Final} />
      </main>
      <${Footer} />
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
</body>
</html>
